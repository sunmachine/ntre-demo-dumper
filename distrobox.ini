# Dev container for building/testing on atomic hosts.
# Create/update:  distrobox assemble create --file distrobox.ini
# Use:            distrobox enter ntre-dev -- cargo build --release
[ntre-dev]
image=registry.fedoraproject.org/fedora:latest
pull=true
additional_packages="rust cargo rustfmt clippy gcc sqlite"
init=false
nvidia=false
# Reuse the host's starship binary (not packaged in Fedora repos) so the
# shared ~/.config/starship.toml prompt works inside the container too.
init_hooks="[ -x /run/host/usr/local/bin/starship ] && ln -sf /run/host/usr/local/bin/starship /usr/local/bin/starship || true"
